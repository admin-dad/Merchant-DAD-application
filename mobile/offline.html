<h1 id="offline-title">No internet connection</h1>
<p id="offline-message">Connect to Wi-Fi or mobile data, then try again. Live shop features need an internet connection.</p>
<a class="retry" id="retry" href="https://merchant-dad-application.vercel.app/">Try again</a>
<p class="hint" id="connection-status" role="status">This screen is available offline.</p>
</section></main>
<footer>Merchant DAD</footer>
<script>
(function(){
  var title=document.getElementById('offline-title');
  var message=document.getElementById('offline-message');
  var status=document.getElementById('connection-status');
  var retry=document.getElementById('retry');
  function update(){
    if(navigator.onLine){
      title.textContent='Unable to connect';
      message.textContent='The app could not reach Merchant DAD. Your internet or the service may be temporarily unavailable. Please try again.';
      status.textContent='Network detected. Tap Try again to reconnect.';
    }else{
      title.textContent='No internet connection';
      message.textContent='Connect to Wi-Fi or mobile data, then try again. Live shop features need an internet connection.';
      status.textContent='This screen is available offline.';
    }
  }
  retry.addEventListener('click',function(event){
    event.preventDefault();
    retry.textContent='Connecting…';
    retry.classList.add('loading');
    status.textContent='Trying to reconnect…';
    window.location.replace('https://merchant-dad-application.vercel.app/');
  });
  window.addEventListener('online',update);
  window.addEventListener('offline',update);
  update();
})();
</script>
